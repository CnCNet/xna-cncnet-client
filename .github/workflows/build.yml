name: build client

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
jobs:
  build-clients:
    runs-on: windows-2025-vs2026
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: ./global.json

    - name: Build
      shell: pwsh
      run: ./Scripts/Build.ps1

    - uses: actions/upload-artifact@v7
      name: Upload Client Artifacts
      with:
        name: artifacts-client
        path: ./Compiled/Resources
          
    - uses: actions/upload-artifact@v7
      name: Upload Migration Tool Artifacts
      with:
        name: artifacts-migration-tool
        path: ./Compiled/MigrationTool
