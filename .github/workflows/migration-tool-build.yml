name: Migration Tool build and publish

on:
  push:
    paths:
      - Directory.Build.targets
      - MigrationTool/**
      - Scripts/Test-MigrationToolBuild.ps1
      - .github/workflows/migration-tool-build.yml
  pull_request:
    paths:
      - Directory.Build.targets
      - MigrationTool/**
      - Scripts/Test-MigrationToolBuild.ps1
      - .github/workflows/migration-tool-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./global.json
          dotnet-version: 8.0.x
      - name: Check solution build and Migration Tool publishing
        shell: pwsh
        run: ./Scripts/Test-MigrationToolBuild.ps1
