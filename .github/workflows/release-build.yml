name: release build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: ./global.json

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: '5.x'

    - name: Determine Version
      uses: gittools/actions/gitversion/execute@v0

    - name: Development Build Check
      if: "!github.event.release.prerelease"
      shell: pwsh
      run: |
        if ($env:GitVersion_CommitsSinceVersionSource -ne "0") {
          Write-Output "::error:: This is a development build and should not be released. Did you forget to create a new tag for the release?"
          exit 1
        }

    - name: Build
      shell: pwsh
      run: |
        ./Scripts/Build.ps1
        mv ./Compiled/Resources/Binaries/MigrationTool ./Compiled/MigrationTool
        rm -r -fo ./Compiled/Resources/BinariesNET8/MigrationTool

    - name: Zip Client Artifacts
      shell: pwsh
      run: 7z a -t7z -mx=9 -m0=lzma2 -ms=on -r -- ${{ format('xna-cncnet-client-{0}.7z', env.GitVersion_SemVer) }} ./Compiled/Resources/*

    - name: Zip Migration Tool Artifacts
      shell: pwsh
      run: 7z a -t7z -mx=9 -m0=lzma2 -ms=on -r -- ${{ format('migration-tool-{0}.7z', env.GitVersion_SemVer) }} ./Compiled/MigrationTool/*

    - name: Upload Final Artifact to the Release
      uses: softprops/action-gh-release@v2
      with:
        append_body: true
        files: |
          ${{ format('xna-cncnet-client-{0}.7z', env.GitVersion_SemVer) }}
          ${{ format('migration-tool-{0}.7z', env.GitVersion_SemVer) }}
